name: IndexNow

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production deploy
        run: sleep 120

      - name: Submit sitemap URLs to IndexNow
        env:
          NEXT_PUBLIC_SITE_URL: https://www.randomanimalgenerator.online
        run: node scripts/submit-indexnow.mjs
